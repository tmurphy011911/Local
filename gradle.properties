#Kotlin
kotlin.code.style=official
# 16GB Mac — modest heap so OS + Xcode + Simulator have room.
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC
# NOTE (2026-06-12): kotlin.native.jvmArgs is IGNORED for the iOS Release link in
# this setup — verified by process inspection: linkReleaseFrameworkIosArm64 runs
# in-process inside the Gradle daemon, so its heap comes from org.gradle.jvmargs
# below. Kept only in case the K/N execution strategy changes in a future Kotlin.
kotlin.native.jvmArgs=-Xmx8g -XX:+UseG1GC -XX:-DoEscapeAnalysis

#Gradle
# 8g (was 4g): the K/N Release whole-program link (iOS archive) runs inside this
# daemon and OOM'd at 4g with a plain "Java heap space" (2026-06-12). The older
# "failed reallocation of scalar replaced objects" crash is a separate JIT
# escape-analysis bug handled by -XX:-DoEscapeAnalysis. Quit the iOS Simulator
# while archiving — 8g daemon + Xcode + Simulator oversubscribes 16GB.
org.gradle.jvmargs=-Xmx8g -XX:+UseG1GC -XX:-DoEscapeAnalysis -Dfile.encoding=UTF-8
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true