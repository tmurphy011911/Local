#Kotlin
kotlin.code.style=official
# 16GB Mac — modest heap so OS + Xcode + Simulator have room.
kotlin.daemon.jvmargs=-Xmx4g -XX:+UseG1GC
# K/N release-link is the actual OOM culprit. "failed reallocation of scalar
# replaced objects" is a JIT escape-analysis bug — not a heap-size issue.
# -XX:-DoEscapeAnalysis disables the optimization that crashes. Small perf
# cost on compile, but Release links reliably instead of intermittently
# OOMing.
kotlin.native.jvmArgs=-Xmx6g -XX:+UseG1GC -XX:-DoEscapeAnalysis

#Gradle
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:-DoEscapeAnalysis -Dfile.encoding=UTF-8
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true