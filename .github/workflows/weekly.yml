name: Weekly — Crawl Venues & Classify Events

on:
  schedule:
    - cron: '0 9 * * 0'  # 9am UTC / 4am EST every Sunday
  workflow_dispatch:
    inputs:
      venue_filter:
        description: 'Comma-separated venue names to crawl (empty = all venues)'
        required: false
        default: ''

# Forward-compat: opt into Node 24 for JS-based actions before the
# June 2 2026 forced-cutoff. Removes deprecation warnings on every job.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Compute the list of active states from the `states` table at workflow
  # start so adding a new state (UPDATE states SET is_live=true WHERE code=…)
  # automatically expands the crawl-venues matrix on the next weekly run —
  # no workflow YAML edit required.
  compute-states:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.fetch.outputs.states }}
    steps:
      - id: fetch
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          STATES=$(curl -sf \
            "https://blifubxslaucshmlphdc.supabase.co/rest/v1/states?is_live=eq.true&select=code&order=code.asc" \
            -H "apikey: $SUPABASE_SERVICE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_KEY" \
            | jq -c '[.[].code]')
          if [ -z "$STATES" ] || [ "$STATES" = "[]" ]; then
            echo "No active states found, falling back to MA,RI,PA"
            STATES='["MA","RI","PA"]'
          fi
          echo "Active states: $STATES"
          echo "states=$STATES" >> "$GITHUB_OUTPUT"

  # crawl-venues was a single 6h+ job that hit GitHub Actions' hard 6h max
  # every weekend, killing itself and skipping the 4 downstream jobs that
  # depended on it. Sharding by state runs each in a parallel runner, each
  # finishing well under 2h. fail-fast=false so one shard hitting a transient
  # venue error doesn't cancel the others.
  crawl-venues:
    runs-on: ubuntu-latest
    needs: compute-states
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        state: ${{ fromJSON(needs.compute-states.outputs.states) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Crawl Venues (${{ matrix.state }})
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VENUE_NAME: ${{ github.event.inputs.venue_filter }}
          STATE: ${{ matrix.state }}
          # Optional — falls back to DEMO_KEY if secret not set. For production
          # weekly crawls, set an NPS_API_KEY secret (free, from api.data.gov).
          NPS_API_KEY: ${{ secrets.NPS_API_KEY }}
        run: node run_crawls.js

  classify-events:
    # Wait for BOTH event sources to finish loading: the long crawl + the
    # parallel municipal-feed sync. Otherwise municipal events miss the
    # Claude classification pass and land with raw/wrong categories.
    runs-on: ubuntu-latest
    needs: [crawl-venues, sync-municipal-feeds]
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Classify & Tag Events
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node classify_events.js

  extract-venues:
    runs-on: ubuntu-latest
    needs: classify-events
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract Venues from Events
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node extract_venues_from_events.js

  discover-municipal-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover Municipal Feeds
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node discover_municipal_feeds.js

  sync-municipal-feeds:
    runs-on: ubuntu-latest
    needs: discover-municipal-feeds
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync Municipal Feeds
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync_municipal_feeds.js

  split-aggregator-events:
    # Re-attribute events from aggregator venues (Harvard Square, Creative
    # Legion, etc.) to the actual venues where they occur. Must run AFTER
    # extract-venues (so newly-discovered venues are matchable) and BEFORE
    # dedupe-pass (so dedupe groups by the corrected lat/lng).
    runs-on: ubuntu-latest
    needs: extract-venues
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Split aggregator events
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          WRITE: '1'
        run: node split_aggregator_events.js

  dedupe-pass:
    runs-on: ubuntu-latest
    needs: split-aggregator-events
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cross-source dedupe (events + venues)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dedupe_pass.js

  backfill-city-photos:
    runs-on: ubuntu-latest
    needs: dedupe-pass
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backfill City Photos (Google Places)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node backfill_city_photos.js
