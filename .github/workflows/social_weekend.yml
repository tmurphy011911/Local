name: Social — This Weekend

# Builds the "things happening this weekend" carousel every Thursday, emails a
# preview, and waits for approval of the `instagram-publish` environment before
# posting. Thursday 15:00 UTC = 11am EDT / 10am EST.
on:
  schedule:
    - cron: '0 15 * * 4'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render + stage only; do not upload, email, or publish'
        type: boolean
        default: false
      date:
        description: 'Override the post date (YYYY-MM-DD, ET) for previews'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: social-weekend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SOCIAL_ALERT_EMAIL: ${{ secrets.SOCIAL_ALERT_EMAIL }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
      SOCIAL_DATE: ${{ inputs.date }}
    outputs:
      should_post: ${{ steps.build.outputs.should_post }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        working-directory: scripts/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: scripts/social
        run: npx playwright install --with-deps chromium
      - name: Build post
        id: build
        working-directory: scripts/social
        run: node build.mjs weekend
      - name: Upload staged post
        uses: actions/upload-artifact@v4
        with:
          name: social-weekend
          path: scripts/social/out/weekend/
          retention-days: 2

  publish:
    needs: build
    if: needs.build.outputs.should_post == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SOCIAL_ALERT_EMAIL: ${{ secrets.SOCIAL_ALERT_EMAIL }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download staged post
        uses: actions/download-artifact@v4
        with:
          name: social-weekend
          path: scripts/social/out/weekend/
      - name: Publish to Instagram
        working-directory: scripts/social
        run: node publish.mjs weekend
