name: Daily — Event Sync, Dedupe & Pattern Prefilter

on:
  schedule:
    - cron: '0 8 * * *'  # 8am UTC / 3am EST daily
  workflow_dispatch: {}

# Forward-compat: opt into Node 24 for JS-based actions before the
# June 2 2026 forced-cutoff. Removes deprecation warnings on every job.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ticketmaster-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ticketmaster Sync
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node ticketmaster_sync.js

  eventbrite-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eventbrite Sync
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node eventbrite_sync.js

  # Deactivation now runs hourly in its own workflow (hourly.yml) so a
  # just-ended event doesn't linger in feeds until the next daily run.
  #
  # Dedupe used to run only weekly (weekly.yml, after the crawl). The daily
  # Ticketmaster + Eventbrite syncs insert the same shows that crawlers also
  # find, so a dup inserted Monday stayed visible until Sunday. Running the
  # cross-source pass daily — right after the two syncs — collapses those
  # within a day. dedupe_pass.js is idempotent and bounded to future, active
  # rows, so the extra runs are cheap and safe.
  dedupe-pass:
    runs-on: ubuntu-latest
    needs: [ticketmaster-sync, eventbrite-sync]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cross-source dedupe (events + venues)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node dedupe_pass.js

  # Deterministic pattern prefilter (no Claude call). Tags future/active events
  # whose title marks them sold out or cancelled — plus the existing recovery /
  # youth-sports / civic-meeting patterns — as subcategory="no-public-interest"
  # so they drop out of carousels, explore, and Yocal. Runs daily (classify only
  # runs the full Claude pass weekly) so a show that sells out or gets cancelled
  # mid-week disappears within a day instead of lingering until Sunday.
  # PREFILTER_ONLY scopes to start_at >= now AND is_active=true (keyset-paginated
  # on the start_at index), so it's IO-light. Aborts if matches exceed
  # AUTO_EXCLUDE_MAX (guards against an upstream title-format change).
  prefilter-exclusions:
    runs-on: ubuntu-latest
    needs: [dedupe-pass]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pattern prefilter (sold-out / cancelled + auto-exclusions)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Fallback for when the Supabase secrets table is unreachable. PREFILTER_ONLY
          # doesn't actually use Claude but the script still benefits from a stable
          # key path; matches what classify_events.js's full-classify run gets in
          # weekly.yml.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PREFILTER_ONLY: '1'
        run: node classify_events.js
