name: Daily — Event Sync & Deactivate Past Events

on:
  schedule:
    - cron: '0 8 * * *'  # 8am UTC / 3am EST daily
  workflow_dispatch: {}

# Forward-compat: opt into Node 24 for JS-based actions before the
# June 2 2026 forced-cutoff. Removes deprecation warnings on every job.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  ticketmaster-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ticketmaster Sync
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node ticketmaster_sync.js

  eventbrite-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Eventbrite Sync
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node eventbrite_sync.js

  deactivate-past-events:
    runs-on: ubuntu-latest
    needs: [ticketmaster-sync, eventbrite-sync]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deactivate Past Events
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node deactivate_past_events.js
