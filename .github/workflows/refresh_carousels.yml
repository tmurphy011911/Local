name: Refresh Carousel Cache

# Pre-compute home-tab carousels for every (metro × category) combo and
# persist to the carousel_cache table. The carousels edge function reads
# from that table on incoming requests, taking server-side latency from
# 3-8 s down to ~50-200 ms.
#
# Runs every 10 minutes. Schedule offset by 3 min from the daily/weekly
# crons so we don't pile up on the runner queue at the top of the hour.

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Raised 15 → 30 after CATEGORIES list grew from 9 to 14 and two
    # consecutive runs cancelled at the 15-minute timeout. Post-MV-cutover
    # each bake should complete in ~2-3 s (was 10-30 s pre-cutover), so
    # 112 bakes ≈ 4-5 min. 30 min gives generous headroom for Boston's
    # heavy assembly and any future category additions.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh carousel_cache
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node refresh_carousel_cache.js
