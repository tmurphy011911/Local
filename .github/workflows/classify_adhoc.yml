name: Ad-hoc — Classify Events Only

# Runs ONLY the classify step, standalone. Built for the 2026-08 backlog
# catch-up: the taste-graph TAGS_ONLY backfill stamped tags onto ~57k
# never-classified rows, which the old "has tags = classified" filter then
# skipped forever (category='other', subcategory NULL — invisible to every
# category rail). classify_events.js now keys on subcategory IS NULL, so
# repeated dispatches of this workflow work the backlog off in bounded bites.
#
# Only SUPABASE_SERVICE_KEY needed (other keys come from the Supabase secrets table).

on:
  workflow_dispatch:
    inputs:
      classify_limit:
        description: "Max events to classify this run (0 = no cap)"
        required: false
        default: "20000"
      write_concurrency:
        description: "Concurrent PATCHes per write group"
        required: false
        default: "4"
      write_delay_ms:
        description: "Pause between write groups (ms)"
        required: false
        default: "300"
      auto_continue:
        description: "Follow-up dispatches to chain after this run (0 = none)"
        required: false
        default: "0"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  classify-events:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Classify & Tag Events
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CLASSIFY_LIMIT: ${{ inputs.classify_limit }}
          WRITE_CONCURRENCY: ${{ inputs.write_concurrency }}
          WRITE_DELAY_MS: ${{ inputs.write_delay_ms }}
        run: node classify_events.js

  # Serial self-chaining: workflow_dispatch fired with the repo GITHUB_TOKEN is
  # one of the two event types exempt from GitHub's recursion block, so this
  # works — bounded by the decrementing auto_continue counter. Runs stay
  # serial (next bite starts only after this one's writes finish), so two
  # runs never classify the same soonest-start_at slice concurrently.
  auto-continue:
    runs-on: ubuntu-latest
    needs: classify-events
    if: ${{ success() && inputs.auto_continue != '0' && inputs.auto_continue != '' }}
    permissions:
      actions: write
    steps:
      - name: Re-dispatch next bite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NEXT=$(( ${{ inputs.auto_continue }} - 1 ))
          echo "Chaining next classify bite (auto_continue=$NEXT after this)"
          gh workflow run classify_adhoc.yml \
            -R "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f classify_limit="${{ inputs.classify_limit }}" \
            -f write_concurrency="${{ inputs.write_concurrency }}" \
            -f write_delay_ms="${{ inputs.write_delay_ms }}" \
            -f auto_continue="$NEXT"
