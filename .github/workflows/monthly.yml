name: Monthly — Discover Venues, Fix URLs & Rank

on:
  schedule:
    - cron: '0 8 1 * *'  # 8am UTC / 3am EST on the 1st of each month
  workflow_dispatch:
    inputs:
      run_discovery:
        description: 'Run Google Places venue discovery (PAUSED until 2027 — coverage is sufficient for all live states; see 2026-08 cost review)'
        type: boolean
        default: false
      states:
        description: 'Optional comma-separated state codes to discover (e.g. CA,NY) — blank = all live states'
        type: string
        default: ''

# Forward-compat: opt into Node 24 for the JS-based actions before the
# June 2 2026 forced-cutoff. Removes deprecation warnings on every job.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── DISCOVERY PAUSED UNTIL 2027 (2026-08-02 cost review) ──────────────
  # The monthly full re-sweep hit every live state's grid (80 centers × 33
  # categories ≈ 6-8k Places API calls at the Enterprise+Atmosphere SKU) to
  # re-fetch venues we almost entirely already have (~60k in the table).
  # Coverage is sufficient for all live states, so discovery no longer runs
  # on the schedule. To run it manually (new state launch, 2027 refresh):
  # workflow_dispatch with run_discovery=true, optionally states=CA,NY to
  # scope the sweep. fix-urls/rank/photos below still run monthly.
  seed-grids:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_discovery }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Seed Grid Centers for New States
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node seed_state_grid.js

  discover-venues:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_discovery }}
    runs-on: ubuntu-latest
    needs: seed-grids
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover New Venues (Google Places)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STATES: ${{ inputs.states }}
        run: node discover_venues_google.js

  fix-venue-urls:
    # Runs whether discovery ran or was skipped (the monthly default);
    # only skips if a requested discovery actually failed.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    needs: discover-venues
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fix Venue URLs
        working-directory: scripts
        # RETRY_GATE only attempts venues worth a token — active, has a website,
        # missing an events_url, rank >= MIN_RANK — and skips any we've already
        # tried and failed on (until RETRY_AFTER_DAYS backoff / MAX_ATTEMPTS).
        # Every attempt is recorded on the venue, so the working set collapses to
        # new + due-for-recheck venues after the first pass. MAX_VENUES bounds the
        # run so it can't hit the timeout the old re-attempt-everything run did
        # (6h on 2026-07-01). Never deactivates.
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RETRY_GATE: '1'
          MIN_RANK: '40'
          MAX_VENUES: '6000'
          CONCURRENCY: '6'
        run: node fix_venue_urls.js

  rank-venues:
    runs-on: ubuntu-latest
    needs: fix-venue-urls
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rank Venues (Claude)
        working-directory: scripts
        # No FORCE — only null-ranked venues (new discoveries) get ranked.
        # The one-time rubric-rebalance re-rank landed with the 2026-06-01 run;
        # FORCE'ing all ~60k venues monthly after that was pure token burn
        # (and silently no-oped in Jul/Aug when the pinned model was retired).
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node rank_venues.js

  backfill-photos:
    runs-on: ubuntu-latest
    needs: rank-venues
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Backfill Venue Photos (Google Places)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node backfill_venue_photos.js

  # ── DISABLED until cross-metro haversine filter ships ─────────────────
  # backfill_reservation_urls.js had cross-metro false positives (Union
  # Transfer Philly → Chicago, Tree House Brewing MA → LA). The 2026-05-01
  # run hit the 30m timeout *and* would have written bad reservation_url
  # data even if it finished. Re-enable only after scripts/backfill_reservation_urls.js
  # gates writes by haversine distance ≤ ~25mi from the venue's lat/lng.
  # backfill-reservations:
  #   runs-on: ubuntu-latest
  #   needs: backfill-photos
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: '22'
  #     - name: Backfill Reservation URLs (Resy / OpenTable)
  #       working-directory: scripts
  #       env:
  #         SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  #       run: node backfill_reservation_urls.js

  reverify-bo-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-verify promoted Bo-Web rows >30 days old
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node monthly_reverify_bo_web.js

  # Porchfests are annual one-day festivals — monthly is plenty (the original
  # ask). Independent job. SELECTIVE by default: it only drills directory
  # entries we DON'T already have as an active future event, so steady-state
  # runs are cheap (a handful of Scrapfly + web-search lookups). The web-search
  # fallback recovers fests whose own site is dead/stale. Keys (Scrapfly /
  # Anthropic / Google) are read from the secrets table via SUPABASE_SERVICE_KEY.
  sync-porchfests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync Porchfests (directory + per-site date drill)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync_porchfests.js

  # MA agricultural fairs — annual multi-day events; monthly cadence, selective
  # (skips fairs already stored as an active future event). Scrapfly-renders the
  # mass.gov directory (Akamai 403s a plain fetch), web-searches each fair's date
  # RANGE + town, geocodes, upserts multi-day `upcoming` events. Keys from the
  # secrets table via SUPABASE_SERVICE_KEY.
  sync-ag-fairs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync MA Agricultural Fairs (mass.gov directory + web-search drill)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync_ag_fairs.js

  # Restaurant weeks are announced months ahead and their dates shift slowly, so
  # monthly is plenty (no need to re-scrape weekly). Independent job. A
  # deterministic scrape of findrestaurantweeks.com's per-state pages writes
  # fully-classified rows (category=food, subcategory=restaurant-week) straight
  # to `events` with a date-free dedupe_hash, so each run overwrites a promo's
  # row as its dates change. Geocodes city→centroid (needs Google key) and
  # scrapes og:image from each organizer link. Small pool (~50 events), runs in
  # under a minute. Supersedes the old Claude-web-search refresh_restaurant_weeks.js.
  sync-restaurant-weeks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync Restaurant Weeks (findrestaurantweeks.com)
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: node sync_restaurant_weeks.js

  # Venue health snapshot — runs AFTER the discover/fix/rank chain so it reflects
  # this month's mutations. `if: always()` so it still reports the current DB
  # state even if an upstream venue job failed. Writes a full Markdown breakdown
  # to the run summary and emails the full report (state % split + per-state
  # event-coverage + events_url content gap) via Resend to ALERT_EMAIL_TO.
  venue-state-of-the-union:
    runs-on: ubuntu-latest
    needs: rank-venues
    if: ${{ always() }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Venue State of the Union
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node venue_state_of_the_union.js
      - name: Email the digest (Resend)
        if: ${{ always() }}
        working-directory: scripts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          set -euo pipefail
          if [ -z "${RESEND_API_KEY:-}" ]; then
            echo "RESEND_API_KEY not set; skipping email (full report is in the run summary)."
            exit 0
          fi
          if [ ! -f sotu_email.html ]; then
            echo "No digest produced (script failed before writing); skipping email."
            exit 0
          fi
          TO="${ALERT_EMAIL_TO:-tom@localapp.live}"
          SUBJECT="$(cat sotu_subject.txt)"
          jq -n \
            --arg from "Local Alerts <onboarding@resend.dev>" \
            --arg to "$TO" \
            --arg subject "$SUBJECT" \
            --rawfile html sotu_email.html \
            '{from:$from, to:[$to], subject:$subject, html:$html}' \
          | curl -sf -X POST "https://api.resend.com/emails" \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              --data @- \
          && echo "Venue State of the Union emailed to $TO."
