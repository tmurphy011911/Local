name: Social Philly — Happening Today

# Builds the daily "X things happening in Philly today" carousel for Philadelphia,
# emails a preview, and posts it to @local.app.philly (IG_USER_ID_PHILLY; if
# that secret is unset it builds but doesn't post). Once a day max.
# 15:30 UTC = 11:30am EDT / 10:30am EST (30 min after Boston).
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Render + stage only; do not upload, email, or publish'
        type: boolean
        default: false
      date:
        description: 'Override the post date (YYYY-MM-DD, ET) for previews'
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: social-philly-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      SOCIAL_CITY: philly
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SOCIAL_ALERT_EMAIL: ${{ secrets.SOCIAL_ALERT_EMAIL }}
      # read-only here: recent captions, so daily posts don't repeat events
      IG_USER_ID: ${{ secrets.IG_USER_ID_PHILLY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
      SOCIAL_DATE: ${{ inputs.date }}
    outputs:
      should_post: ${{ steps.build.outputs.should_post }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        working-directory: scripts/social
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: scripts/social
        run: npx playwright install --with-deps chromium
      - name: Build post
        id: build
        working-directory: scripts/social
        run: node build.mjs daily
      - name: Upload staged post
        uses: actions/upload-artifact@v4
        with:
          name: social-philly-daily
          path: scripts/social/out/daily/
          retention-days: 2

  publish:
    needs: build
    if: needs.build.outputs.should_post == 'true'
    runs-on: ubuntu-latest
    env:
      TZ: America/New_York
      SOCIAL_CITY: philly
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      IG_USER_ID: ${{ secrets.IG_USER_ID_PHILLY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      SOCIAL_ALERT_EMAIL: ${{ secrets.SOCIAL_ALERT_EMAIL }}
      DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download staged post
        uses: actions/download-artifact@v4
        with:
          name: social-philly-daily
          path: scripts/social/out/daily/
      - name: Publish to Instagram
        working-directory: scripts/social
        run: node publish.mjs daily
