name: Municipal Feeds — Discover & Sync

# Standalone workflow for the city/town feed pipeline. The same two jobs
# also run inside the weekly crawl, but this lets us test or refresh
# municipal data on demand without burning 5 hours on the crawler.

on:
  workflow_dispatch:
    inputs:
      state:
        description: 'Two-letter state code to limit discovery (empty = all active states)'
        required: false
        default: ''

jobs:
  discover-municipal-feeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Discover Municipal Feeds
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          STATE: ${{ github.event.inputs.state }}
        run: node discover_municipal_feeds.js

  sync-municipal-feeds:
    runs-on: ubuntu-latest
    needs: discover-municipal-feeds
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Sync Municipal Feeds
        working-directory: scripts
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node sync_municipal_feeds.js
