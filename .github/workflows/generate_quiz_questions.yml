name: Monthly — Generate Daily Local Questions

# Tops up the Daily Local trivia bank with fresh, Claude-generated questions so
# the daily picker (which prefers unused questions) never has to repeat one.
# For each live state x difficulty the edge function counts unused questions and
# generates only the deficit below the target; a unique index + dedup prompt keep
# it from ever adding a duplicate of an already-asked or queued question.
#
# 2nd of each month (offset a day from monthly.yml so runners don't pile up).
# Manual runs via workflow_dispatch (with a dry-run toggle).
#
# Requires repo secret QUIZ_GEN_SECRET (must match the function env of the same
# name, set via: supabase secrets set QUIZ_GEN_SECRET=... --project-ref <prod>).

on:
  schedule:
    - cron: '0 9 2 * *'  # 9am UTC / 4am EST on the 2nd
  workflow_dispatch:
    inputs:
      target_unused:
        description: 'Top up each (state x difficulty) to this many unused questions'
        required: false
        default: '40'
      dry_run:
        description: 'Dry run (generate + dedup, but do not insert)'
        type: boolean
        required: false
        default: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Generate + upsert questions
        env:
          QUIZ_GEN_SECRET: ${{ secrets.QUIZ_GEN_SECRET }}
          TARGET_UNUSED: ${{ github.event.inputs.target_unused || '40' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ -z "$QUIZ_GEN_SECRET" ]; then
            echo "::error::QUIZ_GEN_SECRET repo secret is not set"; exit 1
          fi
          echo "Requesting generation (target=$TARGET_UNUSED dryRun=$DRY_RUN)"
          HTTP=$(curl -sS -w '\n%{http_code}' -X POST \
            "https://blifubxslaucshmlphdc.supabase.co/functions/v1/generate-quiz-questions" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsaWZ1YnhzbGF1Y3NobWxwaGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjgyNjEsImV4cCI6MjA4ODMwNDI2MX0.xx-iy7kKhHviAjtjfXdxNHp4pmKU-in3efr2SkvWTf0" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJsaWZ1YnhzbGF1Y3NobWxwaGRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MjgyNjEsImV4cCI6MjA4ODMwNDI2MX0.xx-iy7kKhHviAjtjfXdxNHp4pmKU-in3efr2SkvWTf0" \
            -H "x-quiz-gen-secret: $QUIZ_GEN_SECRET" \
            -H "Content-Type: application/json" \
            -d "{\"targetUnused\": $TARGET_UNUSED, \"dryRun\": $DRY_RUN}")
          BODY=$(echo "$HTTP" | head -n -1)
          CODE=$(echo "$HTTP" | tail -n 1)
          echo "HTTP $CODE"
          echo "$BODY" | python3 -m json.tool || echo "$BODY"
          if [ "$CODE" != "200" ]; then echo "::error::generation failed ($CODE)"; exit 1; fi
