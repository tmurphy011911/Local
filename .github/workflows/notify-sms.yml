name: Notify — SMS on Workflow Run

# Texts you (via Twilio) every time one of the workflows below finishes,
# with the result (success/failure) and a one-line jobs overview.
#
# NOTE: `workflow_run` only fires for workflows that exist on the DEFAULT branch
# (main), and each watched workflow must be listed by its `name:` field below.
# When you add a NEW workflow, add its name here too or it won't notify.

on:
  workflow_run:
    workflows:
      - "Daily — Event Sync, Dedupe & Pattern Prefilter"
      - "Ad-hoc — Finish Downstream (sync municipal, classify, dedupe)"
      - "Ad-hoc — Fix Venue URLs (state-scoped)"
      - "Hourly — Deactivate Past Events"
      - "Migration Lint (additive-only)"
      - "Monthly — Discover Venues, Fix URLs & Rank"
      - "Ad-hoc — Discover Municipal Feeds (state-scoped)"
      - "Ad-hoc — Rank Venues (state-scoped)"
      - "Refresh Carousel Cache"
      - "Seed Trusted Domains for State"
      - "Sync Prod → Dev DB"
      - "Weekly — Crawl Venues & Classify Events"
    types: [completed]

permissions:
  actions: read

jobs:
  text:
    runs-on: ubuntu-latest
    # Notify policy:
    #   - Every workflow texts on FAILURE (any non-success conclusion).
    #   - On SUCCESS, the high-frequency Hourly/Daily jobs are silenced
    #     (they'd be 25+ texts/day); all other workflows still text on success.
    # To make a workflow success-silent, add its `name:` to the && chain below.
    # To go back to texting every run, replace the whole expression with:
    #   if: ${{ always() }}
    if: >-
      ${{ github.event.workflow_run.conclusion != 'success' ||
          (github.event.workflow_run.name != 'Hourly — Deactivate Past Events' &&
           github.event.workflow_run.name != 'Daily — Event Sync, Dedupe & Pattern Prefilter') }}
    steps:
      - name: Build message
        id: msg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WR_NAME: ${{ github.event.workflow_run.name }}
          WR_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WR_BRANCH: ${{ github.event.workflow_run.head_branch }}
          WR_SHA: ${{ github.event.workflow_run.head_sha }}
          WR_URL: ${{ github.event.workflow_run.html_url }}
          WR_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Per-job overview: how many jobs succeeded, and name any that didn't.
          jobs_json=$(gh api "repos/$REPO/actions/runs/$WR_ID/jobs" --paginate 2>/dev/null || echo '{}')
          total=$(echo "$jobs_json"  | jq '[.jobs[]?] | length')
          okcount=$(echo "$jobs_json" | jq '[.jobs[]? | select(.conclusion == "success")] | length')
          failed=$(echo "$jobs_json"  | jq -r '[.jobs[]? | select(.conclusion != "success" and .conclusion != null and .conclusion != "skipped") | .name] | join(", ")')

          case "$WR_CONCLUSION" in
            success)   emoji="✅";;
            failure)   emoji="❌";;
            cancelled) emoji="🚫";;
            *)         emoji="⚠️";;
          esac

          short_sha=${WR_SHA:0:7}
          overview="${okcount}/${total} jobs ok"
          if [ -n "$failed" ]; then
            overview="$overview — failed: $failed"
          fi

          body=$(printf '%s %s: %s\n%s\nbranch %s @ %s\n%s' \
            "$emoji" "$WR_NAME" "${WR_CONCLUSION^^}" \
            "$overview" "$WR_BRANCH" "$short_sha" "$WR_URL")

          {
            echo "body<<__SMS_EOF__"
            echo "$body"
            echo "__SMS_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Send SMS via Twilio
        env:
          SID:     ${{ secrets.TWILIO_ACCOUNT_SID }}
          TOKEN:   ${{ secrets.TWILIO_AUTH_TOKEN }}
          # Sender: set EITHER a Messaging Service SID (reuses your OTP sender)
          # OR a plain From number. Messaging Service takes precedence if both set.
          MSG_SVC: ${{ secrets.TWILIO_MESSAGING_SERVICE_SID }}
          FROM:    ${{ secrets.TWILIO_FROM }}
          TO:      ${{ secrets.TWILIO_TO }}
          BODY:    ${{ steps.msg.outputs.body }}
        run: |
          set -euo pipefail
          if [ -n "${MSG_SVC:-}" ]; then
            SENDER=(--data-urlencode "MessagingServiceSid=$MSG_SVC")
          else
            SENDER=(--data-urlencode "From=$FROM")
          fi
          curl -fsS -X POST \
            "https://api.twilio.com/2010-04-01/Accounts/$SID/Messages.json" \
            "${SENDER[@]}" \
            --data-urlencode "To=$TO" \
            --data-urlencode "Body=$BODY" \
            -u "$SID:$TOKEN" > /dev/null
          echo "SMS sent."
