# Regression: the "Create a Plan with Bo" entry from the Plans picker reaches a
# live Bo planning conversation.
#
# HARD GATE: the picker entry opens Bo's chat surface and accepts a prompt.
# SOFT TAIL: Bo's actual plan generation is a live Claude call — asserting on the
#   generated plan card would flake, so we only confirm the surface stays alive.
appId: live.localapp.local
tags:
  - plans
  - plan-build
  - bo
---
- runFlow: ../subflows/ensure_home.yaml

- tapOn: "Plans"
- tapOn:
    id: "plan_create_btn"
- tapOn: "Ask Bo"

# HARD GATE: the picker's "Ask Bo" entry opens Bo's chat surface. The chat header
# renders a real Text("Ask Bo") (ChatScreen.kt) that exists nowhere on the Plans
# tab, so its presence proves the surface actually opened. (The empty-input
# placeholder isn't a reliable anchor — the input bar gates on `enabled` and its
# placeholder Text gets merged away.) 06_chat exercises the full type→send path
# into Bo from the concierge entry; here we only verify the picker route reaches
# the same surface, which keeps this flow non-flaky against the live model.
- extendedWaitUntil:
    visible:
      text: "Ask Bo"
    timeout: 15000
