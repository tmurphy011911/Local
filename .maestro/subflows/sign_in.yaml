# Reusable sign-in via TEST_AUTH_BYPASS (debug builds only).
# Order: PHONE -> OTP -> (EMAIL only for profile-less accounts). Any 6-digit OTP
# works; the default phone signs into the canned testbypass@localapp.live account.
# Does NOT clear state — caller decides whether to launch fresh.
appId: live.localapp.local
---
# The splash is a tap-to-continue gate; clear it before expecting AUTH.
- runFlow: dismiss_splash.yaml
- extendedWaitUntil:
    visible: "Continue →"
    timeout: 30000

- tapOn:
    id: "auth_phone_field"
- inputText: "5551234567"
- tapOn: "Continue →"

# OTP step. The field auto-focuses on appear (PhoneAuthScreen LaunchedEffect →
# focusRequester.requestFocus()), so we type straight into the focused field.
# Any 6 digits auto-verify. "Verify →" is the screen's stable anchor.
- assertVisible: "Verify →"
- inputText: "123456"
- tapOn:
    text: "Verify →"
    optional: true   # auto-verify usually fires at the 6th digit

# New/profile-less accounts hit the EMAIL step after OTP; an account with a
# completed profile skips straight to onboarding/home. Fill it only if shown.
- runFlow:
    when:
      visible:
        id: "auth_email_field"
    commands:
      - tapOn:
          id: "auth_email_field"
      - inputText: "testbypass@localapp.live"
      - tapOn: "Continue →"
