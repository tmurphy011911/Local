# Drives onboarding to Home for a genuinely profile-less account (e.g. the
# device-B bypass user). Waits on each step's anchor rather than racing through
# optional taps — the SUCCESS step shows an auto-advancing "events loaded" loader
# that can take several seconds, during which earlier versions fired their taps
# into a screen that wasn't up yet and stalled on Neighbourhoods.
# Uses a fixed Boston location instead of the flaky autocomplete. Assumes the
# caller already signed in.
appId: live.localapp.local
---
- setLocation:
    latitude: 42.3601
    longitude: -71.0589

# --- LOCATION step (optional: caller may enter onboarding already past it) ---
# Permission is pre-granted by the launchApp `permissions` block in the caller,
# so tapping through resolves the seeded location and auto-advances to SUCCESS.
- tapOn:
    text: "Allow Location Access"
    optional: true
- tapOn:
    text: "Allow While Using App|While using the app|Allow|OK"
    optional: true

# --- NEIGHBOURHOODS --- the first reliably-present step. Wait through the
# SUCCESS loader for it. "Skip all →" jumps straight to NOTIFICATIONS
# (OnboardingViewModel.onSkipAll), skipping venues/categories/favourites.
- extendedWaitUntil:
    visible: "Skip all →"
    timeout: 60000
- tapOn: "Skip all →"

# --- NOTIFICATIONS --- the last step; "Skip →" calls onComplete -> Home.
- extendedWaitUntil:
    visible: "Skip →|Turn on notifications →"
    timeout: 30000
- tapOn:
    text: "Skip →"
    optional: true
- tapOn:
    text: "Don’t Allow|Allow|While using the app|OK"
    optional: true

# --- HOME tutorial overlay (HomeTutorial.kt) covers the bottom tabs on first
# landing; "Skip" dismisses the whole 5-page overlay. ---
- tapOn:
    text: "Skip"
    optional: true

# --- HOME reached ---
- extendedWaitUntil:
    visible: "Explore"   # bottom-tab label, present only on Home
    timeout: 60000
